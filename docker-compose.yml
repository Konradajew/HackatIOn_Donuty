services:
  expo-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: donuty-dev-app
    ports:
      - "8081:8081"
    env_file:
      - .env
    command: ["npx", "expo", "start", "${EXPO_START_FLAGS:---lan}"]
    tty: true
    stdin_open: true

    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME}
      - EXPO_TOKEN=${EXPO_TOKEN:-}

    volumes:
      - ${EXPO_HOME_DIR:-/root}/.expo:/root/.expo

    develop:
      watch:
        - action: sync
          path: ./
          target: /app/
          ignore:
            - node_modules/
            - .expo/
            - dist/
            - .git/

        - action: rebuild
          path: ./package.json

        - action: rebuild
          path: ./package-lock.json